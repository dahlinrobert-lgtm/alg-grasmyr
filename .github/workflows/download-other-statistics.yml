name: Download additional Älgdata statistics

on:
  push:
    paths:
      - ".github/workflows/download-other-statistics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Hörneåns — mean age of adult moose (report 9)
        run: |
          python scripts/download_statistics.py \
            --out out/other/hornean_mean-age \
            --area-id 724577 --report-id 9 \
            --from-year "2020/2021" --to-year "2025/2026" \
            --boundary-mode current

      - name: Hörneåns — carcass weight (report 20)
        run: |
          python scripts/download_statistics.py \
            --out out/other/hornean_carcass-weight \
            --area-id 724577 --report-id 20 \
            --from-year "2020/2021" --to-year "2025/2026" \
            --boundary-mode current

      - name: Hörneåns — moose observations (report 25)
        run: |
          python scripts/download_statistics.py \
            --out out/other/hornean_moose-observations \
            --area-id 724577 --report-id 25 \
            --from-year "2020/2021" --to-year "2025/2026" \
            --boundary-mode current

      - name: Gräsmyrs VVO — mean age of adult moose (report 9)
        run: |
          python scripts/download_statistics.py \
            --out out/other/grasmyr_mean-age \
            --area-id 718148 --report-id 9 \
            --from-year "2010/2011" --to-year "2019/2020" \
            --boundary-mode current

      - name: Gräsmyrs VVO — carcass weight (report 20)
        run: |
          python scripts/download_statistics.py \
            --out out/other/grasmyr_carcass-weight \
            --area-id 718148 --report-id 20 \
            --from-year "2010/2011" --to-year "2019/2020" \
            --boundary-mode current

      - name: Gräsmyrs VVO — moose observations (report 25)
        run: |
          python scripts/download_statistics.py \
            --out out/other/grasmyr_moose-observations \
            --area-id 718148 --report-id 25 \
            --from-year "2010/2011" --to-year "2019/2020" \
            --boundary-mode current

      - name: Upload raw table exports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-extra-statistics
          path: out/other/
          if-no-files-found: warn
          retention-days: 13
