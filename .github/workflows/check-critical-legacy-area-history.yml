name: Check historical area changes 2009-2013

on:
  push:
    paths:
      - ".github/workflows/check-critical-legacy-area-history.yml"
      - "scripts/download_statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download unnamed registration 24-01-02-183-A — 2009/10 to 2012/13
        run: |
          python scripts/download_statistics.py             --out out/critical-area-history/unnamed-183             --area-id 718179             --afo-name "Sydöstra älgförvaltningsområdet"             --from-year "2009/2010"             --to-year "2012/2013"             --boundary-mode historical

      - name: Download Höglågdal 24-01-02-098-A — 2009/10 to 2012/13
        run: |
          python scripts/download_statistics.py             --out out/critical-area-history/hoglagdal-098             --area-id 718169             --afo-name "Sydöstra älgförvaltningsområdet"             --from-year "2009/2010"             --to-year "2012/2013"             --boundary-mode historical

      - name: Upload CSVs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-critical-area-history-2009-2013
          path: out/
          if-no-files-found: warn
          retention-days: 14
