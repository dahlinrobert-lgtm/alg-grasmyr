name: Download expanded Älgdata history

on:
  push:
    paths:
      - ".github/workflows/download-expanded-history.yml"
  workflow_dispatch:
    inputs:
      run_extra_statistics:
        description: "Also attempt age, carcass weight and moose observation reports"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "30 5 5 * *"

permissions:
  contents: read

jobs:
  download-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-portal.txt
          python -m playwright install --with-deps chromium

      - name: Download Hörneåns ÄSO, earlier seasons
        run: |
          python scripts/download_statistics.py --out out/harvest/hornean_2010-2019 --area-id 724577 --from-year "2010/2011" --to-year "2019/2020" --boundary-mode historical
      - name: Download Hörneåns ÄSO, recent seasons
        run: |
          python scripts/download_statistics.py --out out/harvest/hornean_2020-2025 --area-id 724577 --from-year "2020/2021" --to-year "2025/2026" --boundary-mode current
      - name: Download Gräsmyrs VVO, early seasons
        run: |
          python scripts/download_statistics.py --out out/harvest/grasmyr_2010-2019 --area-id 718148 --from-year "2010/2011" --to-year "2019/2020" --boundary-mode historical
      - name: Attempt Gräsmyrs VVO, recent seasons
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/harvest/grasmyr_2020-2025 --area-id 718148 --from-year "2020/2021" --to-year "2025/2026" --boundary-mode historical

      - name: Upload harvest data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-harvest-${{ github.run_id }}
          path: out/harvest/
          if-no-files-found: warn
          retention-days: 30

  download-other-statistics:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_extra_statistics) || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-portal.txt
          python -m playwright install --with-deps chromium

      - name: Hörneåns — mean age (report 9)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean_mean-age --area-id 724577 --report-id 9 --from-year "2010/2011" --to-year "2025/2026" --boundary-mode historical
      - name: Hörneåns — carcass weight (report 20)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean_carcass-weight --area-id 724577 --report-id 20 --from-year "2010/2011" --to-year "2025/2026" --boundary-mode historical
      - name: Hörneåns — moose observations (report 25)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean-moose-observations --area-id 724577 --report-id 25 --from-year "2010/2011" --to-year "2025/2026" --boundary-mode historical
      - name: Hörneåns — mean age, recent seasons (report 9)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean_mean-age_2020-2025 --area-id 724577 --report-id 9 --from-year "2020/2021" --to-year "2025/2026" --boundary-mode current
      - name: Hörneåns — carcass weight, recent seasons (report 20)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean_carcass-weight_2020-2025 --area-id 724577 --report-id 20 --from-year "2020/2021" --to-year "2025/2026" --boundary-mode current
      - name: Hörneåns — moose observations, recent seasons (report 25)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/hornean-moose-observations_2020-2025 --area-id 724577 --report-id 25 --from-year "2020/2021" --to-year "2025/2026" --boundary-mode current
      - name: Gräsmyrs VVO — mean age (report 9)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/grasmyr_mean-age --area-id 718148 --report-id 9 --from-year "2010/2011" --to-year "2019/2020" --boundary-mode historical
      - name: Gräsmyrs VVO — carcass weight (report 20)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/grasmyr_carcass-weight --area-id 718148 --report-id 20 --from-year "2010/2011" --to-year "2019/2020" --boundary-mode historical
      - name: Gräsmyrs VVO — moose observations (report 25)
        continue-on-error: true
        run: |
          python scripts/download_statistics.py --out out/extra/grasmyr-moose-observations --area-id 718148 --report-id 25 --to-year "2019/2020" --from-year "2010/2011" --boundary-mode historical

      - name: Upload additional statistics and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-extra-${{ github.run_id }}
          path: out/extra/
          if-no-files-found: warn
          retention-days: 30
