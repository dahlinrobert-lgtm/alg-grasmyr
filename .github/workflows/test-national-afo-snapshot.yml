name: National ÄFO snapshot tests

on:
  pull_request:
    paths:
      - "scripts/snapshot_national_afo.py"
      - "tests/test_national_afo_snapshot.py"
      - "scripts/compare_national_ajo_snapshots.py"
      - "tests/test_national_ajo_snapshot_diff.py"
      - ".github/workflows/daily-national-afo-avskjutning.yml"
      - ".github/workflows/test-national-afo-snapshot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright package
        run: python -m pip install --disable-pip-version-check "playwright==1.56.0"
      - name: Run tests and compile
        run: |
          python -m unittest tests.test_national_afo_snapshot tests.test_national_ajo_snapshot_diff -v
          python -m py_compile scripts/snapshot_national_afo.py scripts/compare_national_ajo_snapshots.py
