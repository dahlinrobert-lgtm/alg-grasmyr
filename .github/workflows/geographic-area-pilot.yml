name: Geographic Älgdata pilot

on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Space-separated county labels; blank uses the default six-region sample"
        required: false
        type: string
        default: ""
      min_end_year:
        description: "Minimum final hunting-season start year in the catalogue"
        required: true
        type: number
        default: 2024

permissions:
  contents: read

concurrency:
  group: geographic-algdata-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test regional candidate selection
        run: python -m unittest tests.test_geographic_pilot -v
      - name: Run bounded regional portal pilot
        env:
          PILOT_COUNTIES: \${{ inputs.counties }}
          MIN_END_YEAR: \${{ inputs.min_end_year }}
        run: |
          if [ -n "$PILOT_COUNTIES" ]; then
            python scripts/run_geographic_pilot.py --counties $PILOT_COUNTIES --min-end-year "$MIN_END_YEAR"
          else
            python scripts/run_geographic_pilot.py --min-end-year "$MIN_END_YEAR"
          fi
      - name: Upload regional pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-algdata-pilot
          path: out/geographic-pilot/
          if-no-files-found: warn
          retention-days: 30
