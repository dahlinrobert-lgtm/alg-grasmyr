name: Test geographic Älgdata pilot

on:
  pull_request:
    paths:
      - "scripts/run_geographic_pilot.py"
      - "scripts/validate_geographic_pilot.py"
      - "scripts/download_statistics.py"
      - "scripts/discover_national_areas.py"
      - "tests/test_geographic_pilot.py"
      - "tests/test_geographic_pilot_validation.py"
      - "tests/test_current_season_pilot.py"
      - ".github/workflows/test-geographic-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install playwright
      - name: Test regional and current-season pilot
        run: python -m unittest tests.test_geographic_pilot tests.test_current_season_pilot tests.test_geographic_pilot_validation -v
      - name: Compile pilot scripts
        run: python -m py_compile scripts/discover_national_areas.py scripts/run_geographic_pilot.py scripts/validate_geographic_pilot.py scripts/download_statistics.py
