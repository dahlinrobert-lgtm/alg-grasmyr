name: Daily regional Älgdata pilot snapshots

on:
  schedule:
    # 09:37 Europe/Stockholm; avoid the top of the hour and handle DST explicitly.
    - cron: "37 9 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-regional-algdata-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    container:
      # Browser binaries and Linux system libraries are baked into this image.
      # This avoids apt-get during every scheduled run (a fragile external dependency).
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Python portal dependency
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 "playwright==1.56.0"
      - name: Run regression tests before portal/browser startup
        run: python -m unittest tests.test_download_statistics tests.test_regional_pilot_snapshots tests.test_geographic_pilot_validation tests.test_regional_dashboard_export -v
      - name: Verify preinstalled Chromium is launchable
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  await page.set_content("<title>playwright-smoke-test</title>")
                  assert await page.title() == "playwright-smoke-test"
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Refresh selector catalogue
        run: |
          python scripts/discover_national_areas.py \
            --county "Norrbottens län" \
            --county "Västerbottens län" \
            --county "Jämtlands län" \
            --county "Dalarnas län" \
            --county "Gävleborgs län" \
            --county "Skåne län"
      - name: Download current-season reports for the 30-area sample
        run: |
          python scripts/run_geographic_pilot.py \
            --min-end-year 2026 \
            --areas-per-county 5
      - name: Validate pilot selection and source reports
        run: python scripts/validate_geographic_pilot.py --directory out/geographic-pilot --min-end-year 2026
      - name: Archive immutable daily snapshots
        run: python scripts/archive_geographic_pilot.py --pilot-dir out/geographic-pilot --output-root data/regional_pilot_snapshots --intraday-root data/regional_pilot_intraday
      - name: Validate archived history and change logs
        run: python scripts/validate_regional_pilot_snapshots.py --root data/regional_pilot_snapshots --intraday-root data/regional_pilot_intraday
      - name: Build public dashboard export
        run: python scripts/build_regional_dashboard_export.py
      - name: Diagnose Git workspace inside Playwright container
        working-directory: ${{ github.workspace }}
        run: |
          echo "pwd=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          echo "Workspace directory:"
          ls -la "$GITHUB_WORKSPACE"
          echo "Git metadata entry:"
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            ls -la "$GITHUB_WORKSPACE/.git"
            if [ -f "$GITHUB_WORKSPACE/.git" ]; then
              cat "$GITHUB_WORKSPACE/.git"
            fi
          else
            echo ".git is absent from GITHUB_WORKSPACE"
          fi
          echo "Git repository detection:"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" status --short
      - name: Commit validated snapshots and dashboard export
        working-directory: ${{ github.workspace }}
        run: |
          # actions/checkout creates the worktree as root inside this container,
          # while workflow steps run as pwuser. Explicitly trust only this checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/regional_pilot_intraday
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" add -A data/regional_pilot_snapshots/ data/regional_pilot_intraday/ data/regional_pilot_dashboard.json
          if ! git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" commit -m "Store daily regional Älgdata snapshots and dashboard export"
            git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" push
          else
            echo "No new regional snapshot changes to commit."
          fi
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-regional-algdata-snapshot
          path: |
            out/geographic-pilot/
            data/regional_pilot_snapshots/
            data/regional_pilot_intraday/
            data/regional_pilot_dashboard.json
          if-no-files-found: warn
          retention-days: 30
