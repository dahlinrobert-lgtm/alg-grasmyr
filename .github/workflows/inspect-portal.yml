name: Inspect public Älgdata portal

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_portal.py"
      - ".github/workflows/inspect-portal.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public portal
        run: python scripts/inspect_portal.py --output portal-inspection.json --seconds 8
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: algdata-portal-inspection
          path: portal-inspection.json
          if-no-files-found: error
          retention-days: 1
