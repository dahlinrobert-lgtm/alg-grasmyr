name: Daily Älgdata statistics snapshot

on:
  schedule:
    # Daily at 06:35 UTC. The Skog monitor runs at 05:17 UTC.
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-algdata-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture Hörneåns ÄSO statistics
        run: |
          python scripts/daily_statistics_snapshot.py \
            --area-key hornean \
            --area-id 724577 \
            --afo-name "Sydöstra älgförvaltningsområdet" \
            --from-year "2020/2021" \
            --to-year "2026/2027" \
            --boundary-mode current

      - name: Commit dated snapshot and change log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Store daily Älgdata statistics snapshot"
            git push
          else
            echo "No snapshot changes to commit."
          fi
