name: Download initial Älgdata reports

on:
  push:
    paths:
      - "scripts/download_statistics.py"
      - ".github/workflows/download-statistics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download Hörneåns ÄSO — 2010/2011 to 2019/2020
        run: |
          python scripts/download_statistics.py \
            --out out/hornean_2010-2019 \
            --area-id 724577 \
            --from-year "2010/2011" \
            --to-year "2019/2020" \
            --boundary-mode current

      - name: Download Hörneåns ÄSO — 2020/2021 to 2025/2026
        run: |
          python scripts/download_statistics.py \
            --out out/hornean_2020-2025 \
            --area-id 724577 \
            --from-year "2020/2021" \
            --to-year "2025/2026" \
            --boundary-mode current

      - name: Download Gräsmyrs VVO — 2010/2011 to 2019/2020
        run: |
          python scripts/download_statistics.py \
            --out out/grasmyr_2010-2019 \
            --area-id 718148 \
            --from-year "2010/2011" \
            --to-year "2019/2020" \
            --boundary-mode current

      - name: Download Gräsmyrs VVO — 2020/2021 to 2025/2026
        run: |
          python scripts/download_statistics.py \
            --out out/grasmyr_2020-2025 \
            --area-id 718148 \
            --from-year "2020/2021" \
            --to-year "2025/2026" \
            --boundary-mode current

      - name: Upload CSVs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-avskjutning-and-grasmyr-hornean
          path: out/
          if-no-files-found: warn
          retention-days: 14
