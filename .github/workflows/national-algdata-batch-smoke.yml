name: National Älgdata batch runner smoke test

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of new areas to download in this run"
        required: true
        type: number
        default: 10
      batch_size:
        description: "Manifest batch size (used when starting a new run)"
        required: true
        type: number
        default: 10
      resume_run_id:
        description: "Previous successful smoke workflow run ID to resume from (leave empty to start fresh)"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: national-algdata-batch-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright dependency
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 "playwright==1.56.0"
      - name: Run unit tests and compile checks
        run: |
          python -m unittest tests.test_national_preflight tests.test_national_preflight_validation tests.test_national_batching tests.test_national_batch_runner -v
          python -m py_compile scripts/run_national_preflight.py scripts/validate_national_preflight.py scripts/national_batching.py scripts/run_national_batches.py
      - name: Restore previous checkpoint artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: national-algdata-batch-smoke
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: out/national-batch-smoke
      - name: Discover current national area catalogue
        if: ${{ inputs.resume_run_id == '' }}
        run: python scripts/discover_national_areas.py
      - name: Freeze five-area-per-AFO candidate list
        if: ${{ inputs.resume_run_id == '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_national_preflight import load_catalog, select_national_candidates, select_geographically_balanced_sample
          rows, metadata = load_catalog(Path("data/national_area_catalog/national_area_catalog.csv"))
          candidates, coverage = select_national_candidates(rows, min_end_year=2026, areas_per_afo=5)
          if not candidates:
              raise SystemExit("No current national candidates selected")
          full_candidate_count = len(candidates)
          smoke_candidates = select_geographically_balanced_sample(candidates, 20)
          Path("out/national-batch-smoke").mkdir(parents=True, exist_ok=True)
          assert 1 <= int("${{ inputs.limit }}") <= 20, "Smoke-test limit must be between 1 and 20"
          assert 1 <= int("${{ inputs.batch_size }}") <= 20, "Smoke-test batch size must be between 1 and 20"
          Path("out/national-batch-smoke/selected_candidates.json").write_text(
              json.dumps({
                  "catalogue_metadata": metadata,
                  "coverage": coverage,
                  "min_end_year": 2026,
                  "areas_per_afo": 5,
                  "full_candidate_count": full_candidate_count,
                  "smoke_sample_strategy": "round_robin_county_then_afo",
                  "candidates": smoke_candidates,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "full_candidate_count": full_candidate_count,
              "smoke_candidate_count": len(smoke_candidates),
              "smoke_counties": sorted({x["county"] for x in smoke_candidates}),
              "afo_count": coverage["afo_count"],
          }, ensure_ascii=False))
          PY
      - name: Validate restored checkpoint and candidate identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("out/national-batch-smoke")
          selected_path = root / "selected_candidates.json"
          if not selected_path.is_file():
              raise SystemExit("selected_candidates.json missing; cannot resume without the frozen candidate list")
          selected = json.loads(selected_path.read_text(encoding="utf-8"))
          candidates = selected.get("candidates")
          if not isinstance(candidates, list) or not candidates:
              raise SystemExit("Frozen candidate list is empty or invalid")
          resume_run_id = "${{ inputs.resume_run_id }}".strip()
          manifest_path = root / "run" / "manifest.json"
          if resume_run_id:
              if not manifest_path.is_file():
                  raise SystemExit("Previous artifact has no run/manifest.json")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("production_write") is not False:
                  raise SystemExit("Refusing checkpoint with production_write other than false")
              if manifest.get("candidates") != candidates:
                  raise SystemExit("Frozen candidate list differs from the checkpoint manifest")
              if manifest.get("candidate_count") != len(candidates):
                  raise SystemExit("Checkpoint candidate_count does not match frozen candidates")
              provenance_path = root / "checkpoint_provenance.json"
              if not provenance_path.is_file():
                  raise SystemExit("Previous artifact lacks checkpoint provenance; cannot verify source run")
              provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
              if str(provenance.get("workflow_run_id")) != resume_run_id:
                  raise SystemExit("Artifact provenance does not match resume_run_id")
          print(json.dumps({
              "resume": bool(resume_run_id),
              "resume_run_id": resume_run_id or None,
              "candidate_count": len(candidates),
              "previous_completed_count": (
                  json.loads(manifest_path.read_text(encoding="utf-8")).get("completed_count", 0)
                  if resume_run_id else 0
              ),
              "production_write": False,
          }, ensure_ascii=False))
          PY
      - name: Run bounded sequential batch smoke test
        run: |
          python scripts/run_national_batches.py \
            --candidates out/national-batch-smoke/selected_candidates.json \
            --out out/national-batch-smoke/run \
            --batch-size "${{ inputs.batch_size }}" \
            --area-timeout 240 \
            --limit "${{ inputs.limit }}"
      - name: Validate checkpoint and result files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("out/national-batch-smoke")
          manifest = json.loads((root / "run" / "manifest.json").read_text(encoding="utf-8"))
          selected = json.loads((root / "selected_candidates.json").read_text(encoding="utf-8"))
          assert manifest["production_write"] is False
          assert manifest["candidates"] == selected["candidates"]
          assert manifest["completed_count"] == len(manifest["results"])
          for area_id, result in manifest["results"].items():
              assert result["status"] in {"success", "no_data", "failed"}
              assert (root / "run" / "areas" / area_id).is_dir()
          print(json.dumps({
              "candidate_count": manifest["candidate_count"],
              "completed_count": manifest["completed_count"],
              "success_count": manifest["success_count"],
              "no_data_count": manifest["no_data_count"],
              "failure_count": manifest["failure_count"],
              "production_write": manifest["production_write"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Write checkpoint provenance
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("out/national-batch-smoke")
          root.mkdir(parents=True, exist_ok=True)
          (root / "checkpoint_provenance.json").write_text(json.dumps({
              "workflow": "national-algdata-batch-smoke",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "previous_workflow_run_id": "${{ inputs.resume_run_id }}",
              "commit_sha": os.environ["GITHUB_SHA"],
              "production_write": False,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload batch smoke diagnostics and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-algdata-batch-smoke
          path: out/national-batch-smoke/
          if-no-files-found: warn
          retention-days: 30
