name: Download 2009/2010 historical area rows

on:
  push:
    paths:
      - ".github/workflows/download-2009-historical-areas.yml"
      - "scripts/download_statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download Mullsjö VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/mullsjo --area-id 718143 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Tallbergslidens VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/tallbergslidens --area-id 718145 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Gräsmyrs VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/grasmyr --area-id 718148 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Hörnsjö VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/hornsjo --area-id 718150 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Hummelholms VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/hummelholm --area-id 718153 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Nyåkers VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/nyaker --area-id 718155 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Djupsjö VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/djupsjo --area-id 718168 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Höglågdal jaktområde — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/hoglagdal --area-id 718169 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download Torrböle VVO — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/torrbole --area-id 718170 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical
      - name: Download unnamed area 24-01-02-183-A — 2009/2010
        run: |
          python scripts/download_statistics.py --out out/2009-2010/unnamed-183 --area-id 718179 --afo-name "Sydöstra älgförvaltningsområdet" --from-year "2009/2010" --to-year "2009/2010" --boundary-mode historical

      - name: Upload CSVs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algdata-historical-areas-2009-2010
          path: out/
          if-no-files-found: warn
          retention-days: 14
