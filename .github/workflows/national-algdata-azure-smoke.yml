name: National Älgdata Azure checkpoint synthetic smoke test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Upload a synthetic snapshot, or restore one from an earlier run
        required: true
        type: choice
        options:
          - upload
          - restore
        default: upload
      source_snapshot_id:
        description: Snapshot ID to restore (required in restore mode)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: national-algdata-azure-synthetic-smoke
  cancel-in-progress: false

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Azure SDK
        run: python -m pip install --disable-pip-version-check "azure-identity>=1.17,<2" "azure-storage-blob>=12.20,<13"

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_SNAPSHOT_ID: ${{ inputs.source_snapshot_id }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "restore" && -z "$SOURCE_SNAPSHOT_ID" ]]; then
            echo "::error::source_snapshot_id is required in restore mode."
            exit 1
          fi
          if [[ "$MODE" == "upload" && -n "$SOURCE_SNAPSHOT_ID" ]]; then
            echo "::error::Leave source_snapshot_id empty in upload mode."
            exit 1
          fi

      - name: Run Azure checkpoint helper unit tests (no Azure access)
        run: python -m unittest tests.test_azure_checkpoint_store tests.test_azure_batch_checkpoint tests.test_azure_checkpoint_pointer -v

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload synthetic checkpoint snapshot
        if: inputs.mode == 'upload'
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          AZURE_STORAGE_CONTAINER: national-algdata
          SNAPSHOT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/azure_checkpoint_store.py smoke-write \
            --collection-id synthetic-oidc-validation \
            --snapshot-id "$SNAPSHOT_ID" | tee "$RUNNER_TEMP/azure-smoke-result.json"
          echo "Uploaded snapshot ID: $SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore and verify synthetic checkpoint snapshot
        if: inputs.mode == 'restore'
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          AZURE_STORAGE_CONTAINER: national-algdata
          SOURCE_SNAPSHOT_ID: ${{ inputs.source_snapshot_id }}
        run: |
          set -euo pipefail
          python scripts/azure_checkpoint_store.py smoke-restore \
            --collection-id synthetic-oidc-validation \
            --snapshot-id "$SOURCE_SNAPSHOT_ID" \
            --output-dir "$RUNNER_TEMP/azure-checkpoint-restore" | tee "$RUNNER_TEMP/azure-restore-result.json"
          echo "Restored and SHA-256 verified snapshot: $SOURCE_SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"
