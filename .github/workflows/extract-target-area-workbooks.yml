name: Extract target-area historical workbook rows

on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_target_area_workbook_rows.py'
      - '.github/workflows/extract-target-area-workbooks.yml'
      - 'data/*.xlsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Extract raw rows by registration number
        run: python scripts/extract_target_area_workbook_rows.py
      - name: Upload audit extract
        uses: actions/upload-artifact@v4
        with:
          name: target-area-historical-workbook-audit
          path: out/target-area-workbook-audit/
          if-no-files-found: error
