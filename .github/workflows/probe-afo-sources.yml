name: Probe national ÄFO statistics and boundary sources

on:
  push:
    paths:
      - "scripts/probe_afo_sources.py"
      - ".github/workflows/probe-afo-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe official boundary services and ÄFO-level report
        run: python scripts/probe_afo_sources.py
      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afo-source-probe
          path: out/afo-source-probe/
          if-no-files-found: warn
          retention-days: 30
