name: Build Älgdata snapshot event ledger

on:
  push:
    paths:
      - "data/daily_snapshots/**"
      - "scripts/build_snapshot_event_ledger.py"
      - "tests/test_snapshot_event_ledger.py"
      - ".github/workflows/build-snapshot-event-ledger.yml"
  schedule:
    - cron: "35 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-algdata-event-ledger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run event ledger tests
        run: python -m unittest discover -s tests -p "test_snapshot_event_ledger.py" -v

      - name: Build deterministic event ledger and quality report
        run: python scripts/build_snapshot_event_ledger.py

      - name: Commit generated ledger and report
        run: |
          if [[ -n "$(git status --porcelain data/events data/quality)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events data/quality
            git commit -m "Update Älgdata snapshot event ledger"
            git push
          else
            echo "Generated event ledger and quality report are unchanged."
          fi
