name: Audit original XLSX boundary exports

on:
  push:
    paths:
      - "scripts/audit_boundary_workbooks.py"
      - ".github/workflows/audit-boundary-workbooks.yml"
      - "data/*.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Audit old and current boundary workbooks
        run: python scripts/audit_boundary_workbooks.py
      - name: Publish readable comparison report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/boundary-comparison-summary.md data/processed/area-registration-boundary-audit.csv data/processed/hornean-area-source-check.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish old-vs-current boundary audit summary"
            git pull --rebase origin main
            git push
          fi
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: original-xlsx-boundary-audit
          path: out/boundary-workbook-audit/
          if-no-files-found: error
          retention-days: 30
