name: Geographic Älgdata pilot

on:
  push:
    paths:
      - "scripts/run_geographic_pilot.py"
      - "scripts/download_statistics.py"
      - "scripts/discover_national_areas.py"
      - "tests/test_current_season_pilot.py"
      - "tests/test_geographic_pilot.py"
      - "data/national_area_catalog/**"
      - ".github/workflows/geographic-area-pilot.yml"
  workflow_dispatch:
    inputs:
      counties:
        description: "Space-separated county labels; blank uses the default six-region sample"
        required: false
        type: string
        default: ""
      min_end_year:
        description: "Optional minimum final hunting-season start year; 0 includes all available years"
        required: true
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: geographic-algdata-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test current-season selection and portal identity checks
        run: |
          python -m unittest tests.test_geographic_pilot tests.test_current_season_pilot -v
          python -m py_compile scripts/discover_national_areas.py scripts/run_geographic_pilot.py scripts/download_statistics.py
      - name: Refresh selector catalogue for the six pilot counties
        run: |
          python scripts/discover_national_areas.py \
            --county "Norrbottens län" \
            --county "Västerbottens län" \
            --county "Jämtlands län" \
            --county "Dalarnas län" \
            --county "Gävleborgs län" \
            --county "Skåne län"
      - name: Run bounded regional portal pilot
        env:
          PILOT_COUNTIES: ${{ inputs.counties || '' }}
          MIN_END_YEAR: ${{ inputs.min_end_year || 0 }}
        run: |
          if [ -n "$PILOT_COUNTIES" ]; then
            python scripts/run_geographic_pilot.py --counties $PILOT_COUNTIES --min-end-year "$MIN_END_YEAR"
          else
            python scripts/run_geographic_pilot.py --min-end-year "$MIN_END_YEAR"
          fi
      - name: Upload regional pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-algdata-pilot
          path: out/geographic-pilot/
          if-no-files-found: warn
          retention-days: 30
