name: National Älgdata batch runner smoke test

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of areas to download (smoke test)"
        required: true
        type: number
        default: 10
      batch_size:
        description: "Manifest batch size"
        required: true
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: national-algdata-batch-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright dependency
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 "playwright==1.56.0"
      - name: Run unit tests and compile checks
        run: |
          python -m unittest tests.test_national_preflight tests.test_national_preflight_validation tests.test_national_batching tests.test_national_batch_runner -v
          python -m py_compile scripts/run_national_preflight.py scripts/validate_national_preflight.py scripts/national_batching.py scripts/run_national_batches.py
      - name: Discover current national area catalogue
        run: python scripts/discover_national_areas.py
      - name: Freeze five-area-per-AFO candidate list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_national_preflight import load_catalog, select_national_candidates
          rows, metadata = load_catalog(Path("data/national_area_catalog/national_area_catalog.csv"))
          candidates, coverage = select_national_candidates(rows, min_end_year=2026, areas_per_afo=5)
          if not candidates:
              raise SystemExit("No current national candidates selected")
          Path("out/national-batch-smoke").mkdir(parents=True, exist_ok=True)
          Path("out/national-batch-smoke/selected_candidates.json").write_text(
              json.dumps({
                  "catalogue_metadata": metadata,
                  "coverage": coverage,
                  "min_end_year": 2026,
                  "areas_per_afo": 5,
                  "candidates": candidates,
              }, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps({"candidate_count": len(candidates), "afo_count": len(coverage)}, ensure_ascii=False))
          PY
      - name: Run bounded sequential batch smoke test
        run: |
          python scripts/run_national_batches.py \
            --candidates out/national-batch-smoke/selected_candidates.json \
            --out out/national-batch-smoke/run \
            --batch-size "${{ inputs.batch_size }}" \
            --area-timeout 240 \
            --limit "${{ inputs.limit }}"
      - name: Validate checkpoint and result files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("out/national-batch-smoke/run")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["production_write"] is False
          assert manifest["completed_count"] <= int("${{ inputs.limit }}")
          assert manifest["completed_count"] == len(manifest["results"])
          for area_id, result in manifest["results"].items():
              assert result["status"] in {"success", "no_data", "failed"}
              assert (root / "areas" / area_id).is_dir()
          print(json.dumps({
              "candidate_count": manifest["candidate_count"],
              "completed_count": manifest["completed_count"],
              "success_count": manifest["success_count"],
              "no_data_count": manifest["no_data_count"],
              "failure_count": manifest["failure_count"],
              "production_write": manifest["production_write"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload batch smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-algdata-batch-smoke
          path: out/national-batch-smoke/
          if-no-files-found: warn
          retention-days: 30
